function ExplicitPrefixBlacklist(args)
   local prefix = tonumber(args.attrs.prefix)
   blacklistIPPrefixLogin(newCA(args.attrs.ip), args.attrs.login, prefix, 60, "explicit prefix blacklist ip login")
   blacklistIPPrefixJA3(newCA(args.attrs.ip), args.attrs.ja3, prefix, 60, "explicit prefix blacklist ip ja3")
   local login_same_prefix = checkBlacklistIPPrefixLogin(newCA(args.attrs.same_prefix_ip), args.attrs.login, prefix)
   local login_different_prefix = checkBlacklistIPPrefixLogin(newCA(args.attrs.different_prefix_ip), args.attrs.login, prefix)
   local ja3_same_prefix = checkBlacklistIPPrefixJA3(newCA(args.attrs.same_prefix_ip), args.attrs.ja3, prefix)
   local ja3_different_prefix = checkBlacklistIPPrefixJA3(newCA(args.attrs.different_prefix_ip), args.attrs.ja3, prefix)
   unblacklistIPPrefixLogin(newCA(args.attrs.ip), args.attrs.login, prefix)
   unblacklistIPPrefixJA3(newCA(args.attrs.ip), args.attrs.ja3, prefix)
   return true, {
      login_same_prefix=login_same_prefix and "true" or "false",
      login_different_prefix=login_different_prefix and "true" or "false",
      ja3_same_prefix=ja3_same_prefix and "true" or "false",
      ja3_different_prefix=ja3_different_prefix and "true" or "false"
   }
end

